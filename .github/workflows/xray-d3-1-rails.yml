name: Validate Rails ActiveRecord D3.1 X-Ray

on:
  push:
    branches: [main]
    paths:
      - "integrations/rails/**"
      - "scripts/causcope_scan.py"
      - "scripts/rails_repository_scan.rb"
      - "scripts/otel_concrete_runtime_facts.py"
      - "scripts/otlp_concrete_receiver.py"
      - "scripts/xray_engine.py"
      - "schema/concrete-system-facts.schema.json"
      - "schema/concrete-runtime-facts.schema.json"
      - "schema/resource-pool-runtime-evidence.schema.json"
      - "xray/profiles/d3-1-concrete-connection-pool.yaml"
      - "lab/rails-connection-pool/**"
      - "RFC/0056-rails-active-record-d3-1-provider.md"
      - "RFC/0058-portable-rails-otlp-runtime.md"
      - "RFC/0061-exact-resource-pool-runtime-binding.md"
      - ".github/workflows/xray-d3-1-rails.yml"
  pull_request:
    paths:
      - "integrations/rails/**"
      - "scripts/causcope_scan.py"
      - "scripts/rails_repository_scan.rb"
      - "scripts/otel_concrete_runtime_facts.py"
      - "scripts/otlp_concrete_receiver.py"
      - "scripts/xray_engine.py"
      - "schema/concrete-system-facts.schema.json"
      - "schema/concrete-runtime-facts.schema.json"
      - "schema/resource-pool-runtime-evidence.schema.json"
      - "xray/profiles/d3-1-concrete-connection-pool.yaml"
      - "lab/rails-connection-pool/**"
      - "RFC/0056-rails-active-record-d3-1-provider.md"
      - "RFC/0058-portable-rails-otlp-runtime.md"
      - "RFC/0061-exact-resource-pool-runtime-binding.md"
      - ".github/workflows/xray-d3-1-rails.yml"

permissions:
  contents: read

concurrency:
  group: rails-d3-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: causcope
          POSTGRES_PASSWORD: causcope
          POSTGRES_DB: causcope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U causcope -d causcope"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 20
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/lab/rails-connection-pool/Gemfile
      RAILS_ENV: production
      RAILS_MAX_THREADS: "5"
      PORT: "4567"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: causcope
      DB_PASSWORD: causcope
      DB_NAME: causcope
      DB_POOL: "1"
      DB_CHECKOUT_TIMEOUT: "5"
      CAUSCOPE_SYSTEM_ID: rails-connection-pool-app
      CAUSCOPE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      CAUSCOPE_REPOSITORY: https://github.com/sergii/causcope
      CAUSCOPE_INCIDENT_ID: INC-D3-1-RAILS
      CAUSCOPE_STATIC_FACTS: /tmp/rails-d3-static.json
      CAUSCOPE_OTEL_SYNC: "1"
      OTEL_SERVICE_NAME: causcope-rails-connection-pool
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://127.0.0.1:4318/v1/traces

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema opentelemetry-proto

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true

      - name: Validate portable Rails runtime syntax
        run: ruby -c integrations/rails/causcope_runtime.rb

      - name: Scan revision-bound Rails pool facts through product provider
        run: |
          ./bin/causcope scan lab/rails-connection-pool \
            --provider rails \
            --environment production \
            --env-file deployment.yml \
            --system-id "$CAUSCOPE_SYSTEM_ID" \
            --revision "$CAUSCOPE_REVISION" \
            --repository "$CAUSCOPE_REPOSITORY" \
            --output /tmp/rails-d3-static.json

          python scripts/concrete_system_facts.py /tmp/rails-d3-static.json --pretty

          python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path('/tmp/rails-d3-static.json').read_text())
          pools = [entity for entity in document['entities'] if entity['kind'] == 'resource_pool']
          assert len(pools) == 1, pools
          pool = pools[0]
          assert pool['id'] == 'pool:active_record.primary'
          assert pool['attributes']['technology'] == 'active_record'
          assert pool['attributes']['adapter'] == 'postgresql'
          assert pool['attributes']['config_name'] == 'primary'
          assert pool['attributes']['configured_capacity'] == 1
          assert any(
              fact['subject'] == 'code:PoolController#work()'
              and fact['relation'] == 'depends_on'
              and fact['object'] == pool['id']
              for fact in document['facts']
          )
          PY

      - name: Start concrete OTLP receiver
        run: |
          python scripts/otlp_concrete_receiver.py \
            --static-facts /tmp/rails-d3-static.json \
            --incident-id "$CAUSCOPE_INCIDENT_ID" \
            --snapshot /tmp/rails-d3-runtime.json \
            --source-uri otlp:http:rails-active-record \
            > /tmp/rails-d3-otlp.log 2>&1 &
          echo $! > /tmp/rails-d3-otlp.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4318/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/rails-d3-otlp.log
          exit 1

      - name: Start Rails application with portable runtime integration
        run: |
          pushd lab/rails-connection-pool
          bundle exec puma -C config/puma.rb > /tmp/rails-d3-puma.log 2>&1 &
          echo $! > /tmp/rails-d3-puma.pid
          popd

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4567/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/rails-d3-puma.log
          exit 1

      - name: Capture ActiveRecord pool evidence
        env:
          APP_URL: http://127.0.0.1:4567
          HOLD_MS: "2000"
        run: bundle exec ruby lab/rails-connection-pool/concrete_probe.rb > /tmp/rails-d3-pool.json

      - name: Validate ActiveRecord resource-pool evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path('schema/resource-pool-runtime-evidence.schema.json').read_text())
          evidence = json.loads(Path('/tmp/rails-d3-pool.json').read_text())
          jsonschema.Draft202012Validator(schema, format_checker=jsonschema.FormatChecker()).validate(evidence)

          assert evidence['pool']['technology'] == 'active_record'
          assert evidence['pool']['configured_capacity'] == 1
          assert evidence['pool']['observed_capacity'] == 1
          assert evidence['dependency_control']['reachable'] is True
          assert evidence['request']['dependency_backend_id'] != evidence['dependency_control']['backend_id']
          assert all(evidence['assertions'].values()), evidence['assertions']
          print(json.dumps(evidence['assertions'], indent=2, sort_keys=True))
          PY

      - name: Verify official OTLP exporter reached Causcope receiver with exact pool identity
        run: |
          for attempt in $(seq 1 30); do
            if [ -s /tmp/rails-d3-runtime.json ]; then
              break
            fi
            sleep 1
          done

          python - <<'PY'
          import json
          from pathlib import Path

          pool = json.loads(Path('/tmp/rails-d3-pool.json').read_text())
          runtime = json.loads(Path('/tmp/rails-d3-runtime.json').read_text())
          request = pool['request']
          matches = [
              execution for execution in runtime['executions']
              if execution['code_symbol'] == request['code_symbol']
              and execution['trace_id'] == request['trace_id']
              and execution['span_id'] == request['span_id']
          ]
          assert len(matches) == 1, (request, runtime['executions'])
          execution = matches[0]
          assert execution['source']['uri'] == 'otlp:http:rails-active-record'

          interactions = [
              interaction for interaction in runtime['pool_interactions']
              if interaction['execution_id'] == execution['id']
              and interaction['pool_id'] == pool['pool']['id']
              and interaction['technology'] == 'active_record'
              and interaction['trace_id'] == request['trace_id']
              and interaction['span_id'] == request['span_id']
          ]
          assert len(interactions) == 1, runtime['pool_interactions']
          interaction = interactions[0]
          assert interaction['config_name'] == 'primary'
          assert interaction['role'] == 'writing'
          assert interaction['shard'] == 'default'
          assert interaction['checkout_wait_ms'] >= 0
          assert runtime['system_id'] == pool['system_id']
          assert runtime['revision']['value'] == pool['revision']['value']
          assert runtime['incident_id'] == pool['incident_id']
          print(json.dumps({'execution': execution, 'pool_interaction': interaction}, indent=2, sort_keys=True))
          PY

          curl --fail --silent http://127.0.0.1:4318/status

      - name: Run generic D3.1 concrete profile with exact runtime pool binding
        run: |
          python scripts/xray_engine.py \
            --profile xray/profiles/d3-1-concrete-connection-pool.yaml \
            --input static=/tmp/rails-d3-static.json \
            --input runtime=/tmp/rails-d3-runtime.json \
            --input pool=/tmp/rails-d3-pool.json \
            --require-state CAUSAL_DIAGNOSIS_CONFIRMED \
            --output /tmp/rails-d3-xray.json

          cat /tmp/rails-d3-xray.json

      - name: Verify technology and identity fail closed
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          import yaml

          from scripts.xray_engine import project

          profile = yaml.safe_load(Path('xray/profiles/d3-1-concrete-connection-pool.yaml').read_text())
          static = json.loads(Path('/tmp/rails-d3-static.json').read_text())
          runtime = json.loads(Path('/tmp/rails-d3-runtime.json').read_text())
          pool = json.loads(Path('/tmp/rails-d3-pool.json').read_text())

          def state(static_document=static, runtime_document=runtime, pool_document=pool):
              return project(profile, {'static': static_document, 'runtime': runtime_document, 'pool': pool_document})['epistemic_state']

          assert state() == 'CAUSAL_DIAGNOSIS_CONFIRMED'

          missing_pool_interaction = copy.deepcopy(runtime)
          missing_pool_interaction['pool_interactions'] = []
          assert state(runtime_document=missing_pool_interaction) == 'PRECONDITIONS_PRESENT'

          wrong_runtime_pool = copy.deepcopy(runtime)
          wrong_runtime_pool['pool_interactions'][0]['pool_id'] = 'pool:active_record.unknown'
          assert state(runtime_document=wrong_runtime_pool) == 'PRECONDITIONS_PRESENT'

          wrong_technology = copy.deepcopy(pool)
          wrong_technology['pool']['technology'] = 'psycopg_pool'
          assert state(pool_document=wrong_technology) == 'PRECONDITIONS_PRESENT'

          wrong_trace = copy.deepcopy(pool)
          wrong_trace['request']['trace_id'] = '0' * 32
          assert state(pool_document=wrong_trace) == 'PRECONDITIONS_PRESENT'

          wrong_capacity = copy.deepcopy(pool)
          wrong_capacity['pool']['observed_capacity'] = 2
          assert state(pool_document=wrong_capacity) == 'PRECONDITIONS_PRESENT'

          unavailable_database_control = copy.deepcopy(pool)
          unavailable_database_control['assertions']['database_still_accepts_direct_connections'] = False
          assert state(pool_document=unavailable_database_control) == 'CHECKOUT_WAIT_OBSERVED'

          wrong_revision = copy.deepcopy(runtime)
          wrong_revision['revision']['value'] = 'different-revision'
          try:
              state(runtime_document=wrong_revision)
          except ValueError as exc:
              assert 'identity group revision' in str(exc)
          else:
              raise AssertionError('revision mismatch must fail closed')
          PY

      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/rails-d3-puma.pid ]; then
            kill "$(cat /tmp/rails-d3-puma.pid)" || true
          fi
          if [ -f /tmp/rails-d3-otlp.pid ]; then
            kill "$(cat /tmp/rails-d3-otlp.pid)" || true
          fi
          cat /tmp/rails-d3-puma.log || true
          cat /tmp/rails-d3-otlp.log || true
