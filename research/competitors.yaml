version: 0.1
reviewed_at: 2026-09-14
purpose: >-
  Machine-readable registry of direct competitors, adjacent products, evidence providers,
  and historical references relevant to CauScope. This file is intended to become the
  source for future website comparison tables and should be extended as new products
  are discovered.

value_legend:
  yes: Public product material clearly claims or demonstrates the capability.
  partial: The capability exists, but only for part of the product surface or with a narrower meaning.
  no: Public product material clearly indicates the product is not primarily offering this capability.
  unknown: Not established from the sources reviewed.

comparison_axes:
  - telemetry_context
  - code_context
  - live_topology
  - failure_ontology
  - explicit_causal_graph
  - change_context
  - hypothesis_testing
  - falsification_or_verification
  - blast_radius
  - proactive_risk
  - live_runtime_probes
  - remediation
  - incident_workflow
  - self_hosting_or_byoc
  - open_source

entries:
  - id: causely
    name: Causely
    class: direct
    homepage: https://www.causely.ai/
    positioning: Causal intelligence layer and AI SRE foundation for production systems.
    why_relevant: >-
      Closest conceptual benchmark found so far. Causely combines an ontology of entity types,
      failure modes and constraints with live topology and a causality graph, then performs causal
      inference for root cause, blast radius and proactive reliability.
    causcope_angle: >-
      CauScope should differentiate through executable failure knowledge, evidence-backed
      falsification, application/code semantics, framework-specific vertical slices, and an open
      adapter model rather than trying to become a general cloud observability platform.
    capabilities:
      telemetry_context: yes
      code_context: partial
      live_topology: yes
      failure_ontology: yes
      explicit_causal_graph: yes
      change_context: yes
      hypothesis_testing: partial
      falsification_or_verification: partial
      blast_radius: yes
      proactive_risk: yes
      live_runtime_probes: unknown
      remediation: yes
      incident_workflow: partial
      self_hosting_or_byoc: partial
      open_source: no
    sources:
      - https://www.causely.ai/product
      - https://install.causely.ai/platform/
      - https://www.causely.ai/product/ai-sre

