name: Validate Rubydex concrete-system bridge

on:
  push:
    branches: [main]
    paths:
      - "scripts/rubydex_concrete_system_facts.rb"
      - "scripts/verify_rubydex_concrete_system_extractor.py"
      - "scripts/rails_concrete_system_enrichment.py"
      - "scripts/verify_rails_deadlock_enrichment.py"
      - "scripts/otel_concrete_runtime_facts.py"
      - "scripts/d2_2_xray_projection.py"
      - "scripts/verify_d2_2_runtime_projection.py"
      - "schema/concrete-system-facts.schema.json"
      - "schema/concrete-runtime-facts.schema.json"
      - "scripts/concrete_system_facts.py"
      - "lab/rubydex-concrete-system/**"
      - "RFC/0047-rubydex-concrete-system-extractor.md"
      - "RFC/0048-rails-deadlock-static-enrichment.md"
      - "RFC/0049-concrete-runtime-execution-projection.md"
      - ".github/workflows/rubydex-concrete-system.yml"
  pull_request:
    paths:
      - "scripts/rubydex_concrete_system_facts.rb"
      - "scripts/verify_rubydex_concrete_system_extractor.py"
      - "scripts/rails_concrete_system_enrichment.py"
      - "scripts/verify_rails_deadlock_enrichment.py"
      - "scripts/otel_concrete_runtime_facts.py"
      - "scripts/d2_2_xray_projection.py"
      - "scripts/verify_d2_2_runtime_projection.py"
      - "schema/concrete-system-facts.schema.json"
      - "schema/concrete-runtime-facts.schema.json"
      - "scripts/concrete_system_facts.py"
      - "lab/rubydex-concrete-system/**"
      - "RFC/0047-rubydex-concrete-system-extractor.md"
      - "RFC/0048-rails-deadlock-static-enrichment.md"
      - "RFC/0049-concrete-runtime-execution-projection.md"
      - ".github/workflows/rubydex-concrete-system.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"

      - name: Install Rubydex fixture dependencies
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/lab/rubydex-concrete-system/Gemfile
        run: bundle install

      - name: Export concrete system facts twice
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/lab/rubydex-concrete-system/Gemfile
        run: |
          bundle exec ruby scripts/rubydex_concrete_system_facts.rb \
            --workspace lab/rubydex-concrete-system \
            --system-id rubydex-fixture \
            --revision fixture-revision \
            --repository sergii/causcope \
            --output /tmp/rubydex-facts-a.json

          bundle exec ruby scripts/rubydex_concrete_system_facts.rb \
            --workspace lab/rubydex-concrete-system \
            --system-id rubydex-fixture \
            --revision fixture-revision \
            --repository sergii/causcope \
            --output /tmp/rubydex-facts-b.json

          diff -u /tmp/rubydex-facts-a.json /tmp/rubydex-facts-b.json

      - name: Validate direct Rubydex semantic boundary
        run: python scripts/verify_rubydex_concrete_system_extractor.py /tmp/rubydex-facts-a.json

      - name: Add conservative Rails static enrichment twice
        run: |
          python scripts/rails_concrete_system_enrichment.py \
            --input /tmp/rubydex-facts-a.json \
            --workspace lab/rubydex-concrete-system \
            --output /tmp/rails-facts-a.json

          python scripts/rails_concrete_system_enrichment.py \
            --input /tmp/rubydex-facts-a.json \
            --workspace lab/rubydex-concrete-system \
            --output /tmp/rails-facts-b.json

          diff -u /tmp/rails-facts-a.json /tmp/rails-facts-b.json

      - name: Verify D2.2 structural precondition without runtime overclaim
        run: python scripts/verify_rails_deadlock_enrichment.py /tmp/rails-facts-a.json

      - name: Project revision-bound OTel executions twice
        run: |
          python scripts/otel_concrete_runtime_facts.py \
            --static-facts /tmp/rails-facts-a.json \
            --otlp lab/rubydex-concrete-system/runtime/overlapping-code-paths.otlp.json \
            --incident-id INC-D2-2-XRAY \
            --source-uri fixture:overlapping-code-paths \
            --output /tmp/runtime-facts-a.json

          python scripts/otel_concrete_runtime_facts.py \
            --static-facts /tmp/rails-facts-a.json \
            --otlp lab/rubydex-concrete-system/runtime/overlapping-code-paths.otlp.json \
            --incident-id INC-D2-2-XRAY \
            --source-uri fixture:overlapping-code-paths \
            --output /tmp/runtime-facts-b.json

          diff -u /tmp/runtime-facts-a.json /tmp/runtime-facts-b.json

      - name: Derive D2.2 X-Ray runtime risk twice
        run: |
          python scripts/d2_2_xray_projection.py \
            --static-facts /tmp/rails-facts-a.json \
            --runtime-facts /tmp/runtime-facts-a.json \
            --output /tmp/d2-2-xray-a.json

          python scripts/d2_2_xray_projection.py \
            --static-facts /tmp/rails-facts-a.json \
            --runtime-facts /tmp/runtime-facts-a.json \
            --output /tmp/d2-2-xray-b.json

          diff -u /tmp/d2-2-xray-a.json /tmp/d2-2-xray-b.json

      - name: Verify revision binding and D2.2 epistemic boundary
        run: |
          python scripts/verify_d2_2_runtime_projection.py \
            --static-facts /tmp/rails-facts-a.json \
            --runtime-facts /tmp/runtime-facts-a.json \
            --projection /tmp/d2-2-xray-a.json \
            --otlp lab/rubydex-concrete-system/runtime/overlapping-code-paths.otlp.json
