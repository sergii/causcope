name: Validate multi-target execution set

on:
  pull_request:
    paths:
      - "scripts/routed_execution_sets.py"
      - "scripts/routed_execution_set_mcp_tool.py"
      - "scripts/routed_execution_set_journal.py"
      - "scripts/routed_execution_set_status.py"
      - "scripts/test_multi_target_execution_set.py"
      - "scripts/test_routed_execution_set_journal.py"
      - "scripts/test_routed_execution_set_status.py"
      - "scripts/routed_agent_plan.py"
      - "scripts/routing_mcp_server.py"
      - "scripts/test_routing_mcp_server.py"
      - "schema/routed-execution-sets.schema.json"
      - "schema/routed-execution-set-journal-event.schema.json"
      - "schema/routed-execution-set-status.schema.json"
      - "schema/routed-agent-plan.schema.json"
      - "RFC/0069-multi-target-execution-set-lifecycle.md"
      - "RFC/0071-durable-execution-set-journal.md"
      - "RFC/0073-execution-set-status-projection.md"
      - ".github/workflows/multi-target-execution-set.yml"
  push:
    branches: [main]
    paths:
      - "scripts/routed_execution_sets.py"
      - "scripts/routed_execution_set_mcp_tool.py"
      - "scripts/routed_execution_set_journal.py"
      - "scripts/routed_execution_set_status.py"
      - "scripts/test_multi_target_execution_set.py"
      - "scripts/test_routed_execution_set_journal.py"
      - "scripts/test_routed_execution_set_status.py"
      - "scripts/routed_agent_plan.py"
      - "scripts/routing_mcp_server.py"
      - "scripts/test_routing_mcp_server.py"
      - "schema/routed-execution-sets.schema.json"
      - "schema/routed-execution-set-journal-event.schema.json"
      - "schema/routed-execution-set-status.schema.json"
      - "schema/routed-agent-plan.schema.json"
      - "RFC/0069-multi-target-execution-set-lifecycle.md"
      - "RFC/0071-durable-execution-set-journal.md"
      - "RFC/0073-execution-set-status-projection.md"
      - ".github/workflows/multi-target-execution-set.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate multi-target execution set
        run: python scripts/test_multi_target_execution_set.py

      - name: Validate durable execution-set journal
        run: python scripts/test_routed_execution_set_journal.py

      - name: Validate execution-set status projection
        run: python scripts/test_routed_execution_set_status.py
