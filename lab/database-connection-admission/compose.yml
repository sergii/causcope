services:
  db:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - max_connections=8
      - -c
      - superuser_reserved_connections=2
    environment:
      POSTGRES_USER: causcope_admin
      POSTGRES_PASSWORD: causcope
      POSTGRES_DB: causcope
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causcope_admin -d causcope"]
      interval: 1s
      timeout: 1s
      retries: 30

  harness:
    build: .
    image: causcope-database-connection-admission-lab
    command: ["sleep", "infinity"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: causcope
      ADMIN_USER: causcope_admin
      ADMIN_PASSWORD: causcope
      APP_USER: causcope_app
      APP_PASSWORD: causcope_app
      MAX_ATTEMPTS: "20"
    depends_on:
      db:
        condition: service_healthy

  probe:
    image: causcope-database-connection-admission-lab
    command: ["python", "/lab/probe.py"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: causcope
      ADMIN_USER: causcope_admin
      ADMIN_PASSWORD: causcope
      APP_USER: causcope_app
      APP_PASSWORD: causcope_app
      MAX_ATTEMPTS: "20"
    depends_on:
      db:
        condition: service_healthy
