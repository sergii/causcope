id: hypothesis.database.autovacuum_pressure
kind: hypothesis
title: PostgreSQL autovacuum pressure
summary: Dead-tuple accumulation has crossed effective vacuum trigger thresholds, or routine autovacuum is disabled, creating maintenance pressure that can contribute to table/index bloat and degraded query behavior if it persists.
predictions:
  - observation: observation.database.vacuum_pressure
    expected: present
    strength: strong
  - observation: observation.database.autovacuum_disabled
    expected: may_be_present
    strength: moderate
  - observation: observation.database.query_latency
    expected: may_rise_if_pressure_persists_and_bloat_accumulates
    strength: moderate
falsifiers:
  - observation: observation.database.vacuum_pressure
    condition: absent_in_complete_relation_stats_snapshot
    effect: decrease
tested_by:
  - probe.database.inspect_vacuum_health
  - probe.database.measure_query_latency
related_to:
  - hypothesis.latency.database
  - system_entity.database
  - boundary.application.database
common_misconceptions:
  - Crossing the autovacuum trigger proves that autovacuum is broken.
  - autovacuum=false means PostgreSQL will never vacuum for transaction ID wraparound prevention.
search_terms:
  - postgres autovacuum pressure
  - pg_stat_user_tables n_dead_tup
  - autovacuum_vacuum_threshold
  - autovacuum_vacuum_scale_factor
  - autovacuum_enabled false
