name: Run OpenAI MCP acceptance benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model ID
        required: false
        default: gpt-5.6-luna
      max_turns:
        description: Maximum Responses API turns
        required: false
        default: "8"
      max_output_tokens:
        description: Maximum output tokens per Responses API turn
        required: false
        default: "1200"
  push:
    branches:
      - benchmark/openai-mcp-real-20260915

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BENCHMARK_MODEL: ${{ inputs.model || 'gpt-5.6-luna' }}
      BENCHMARK_MAX_TURNS: ${{ inputs.max_turns || '8' }}
      BENCHMARK_MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens || '1200' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Require explicit OpenAI API credential
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required for this opt-in paid benchmark." >&2
            exit 2
          fi

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate OpenAI MCP client policy without network
        run: python scripts/test_openai_mcp_client.py

      - name: Run real OpenAI-backed MCP acceptance benchmark
        run: |
          python scripts/run_openai_mcp_acceptance_benchmark.py \
            --model "$BENCHMARK_MODEL" \
            --max-turns "$BENCHMARK_MAX_TURNS" \
            --max-output-tokens "$BENCHMARK_MAX_OUTPUT_TOKENS" \
            --workspace /tmp/causcope-openai-mcp \
            --result /tmp/causcope-openai-mcp-result.json

      - name: Verify benchmark result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('.')
          result = json.loads(Path('/tmp/causcope-openai-mcp-result.json').read_text())
          schema = json.loads((root / 'schema/acceptance-benchmark-result.schema.json').read_text())
          errors = list(Draft202012Validator(schema).iter_errors(result))
          assert not errors, '; '.join(error.message for error in errors)
          assert result['surface'] == 'openai_mcp_agent'
          assert result['llm']['enabled'] is True
          assert result['llm']['provider'] == 'openai'
          assert result['llm']['api_key_exposed_to_testbed_children'] is False
          assert result['oracle_policy']['loaded_after_investigation'] is True
          assert result['oracle_policy']['used_to_construct_diagnosis'] is False
          assert result['passed'] is True
          PY

      - name: Upload acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-mcp-acceptance-result
          path: |
            /tmp/causcope-openai-mcp-result.json
            /tmp/causcope-openai-mcp/openai-mcp-client-run.json
            /tmp/causcope-openai-mcp/diagnosis-summary.json
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f testbed/shop/compose.yaml --profile scenarios down -v --remove-orphans
