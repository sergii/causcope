services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: causcope
      POSTGRES_PASSWORD: causcope
      POSTGRES_DB: causcope
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causcope -d causcope"]
      interval: 1s
      timeout: 1s
      retries: 30

  app:
    build: .
    command: ["python", "/lab/app.py"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: causcope
      DB_PASSWORD: causcope
      DB_NAME: causcope
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8080),1); s.close()"]
      interval: 1s
      timeout: 1s
      retries: 30

  probe:
    build: .
    command: ["python", "/lab/probe.py"]
    environment:
      APP_HOST: app
      APP_PORT: "8080"
    depends_on:
      app:
        condition: service_healthy
