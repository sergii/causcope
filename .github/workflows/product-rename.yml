name: One-shot product rename

on:
  push:
    branches:
      - chore/rename-atlerror-to-causcope

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace product name everywhere
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = (
              (b"ATLERROR", b"CAUSCOPE"),
              (b"Atlerror", b"Causcope"),
              (b"atlerror", b"causcope"),
          )

          root = Path(".")
          for path in sorted(root.rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue
              data = path.read_bytes()
              if b"\x00" in data:
                  continue
              updated = data
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != data:
                  path.write_bytes(updated)

          def renamed(name: str) -> str:
              return (
                  name.replace("ATLERROR", "CAUSCOPE")
                  .replace("Atlerror", "Causcope")
                  .replace("atlerror", "causcope")
              )

          paths = [p for p in root.rglob("*") if ".git" not in p.parts]
          for path in sorted(paths, key=lambda p: len(p.parts), reverse=True):
              new_name = renamed(path.name)
              if new_name != path.name and path.exists():
                  path.rename(path.with_name(new_name))
          PY

      - name: Remove migration workflow
        run: rm .github/workflows/product-rename.yml

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Rename Atlerror to Causcope everywhere"
          git push origin HEAD:${GITHUB_REF_NAME}
