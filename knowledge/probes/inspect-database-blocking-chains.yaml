id: probe.database.inspect_blocking_chains
kind: probe
title: Inspect database blocking chains
summary: Inspect current database sessions and blocker relationships to reconstruct exact blocker-to-blocked chains without reading SQL text.
produces:
  - observation.database.blocking_chain
  - observation.database.lock_wait_event
requires:
  - capability.database.inspect_locks
preferred_tools:
  - tool.postgresql
risk: read_only
