default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", "5432") %>
  username: <%= ENV.fetch("DB_USER", "causcope") %>
  password: <%= ENV.fetch("DB_PASSWORD", "causcope") %>
  pool: <%= ENV.fetch("DB_POOL", "5") %>
  checkout_timeout: <%= ENV.fetch("DB_CHECKOUT_TIMEOUT", "5") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "causcope") %>

multi_database:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "causcope") %>
  replica:
    <<: *default
    database: <%= ENV.fetch("REPLICA_DB_NAME", "causcope") %>
    replica: true
