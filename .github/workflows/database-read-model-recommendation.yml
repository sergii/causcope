name: Validate database read-model recommendation gate

on:
  push:
    branches: [main]
    paths:
      - "schema/database-read-model-recommendation-context.schema.json"
      - "schema/architectural-recommendation-projection.schema.json"
      - "schema/recommendation-information-gap-projection.schema.json"
      - "schema/recommendation-evidence-acquisition-result.schema.json"
      - "scripts/database_read_model_recommendation.py"
      - "scripts/recommendation_information_gaps.py"
      - "scripts/recommendation_evidence_acquisition.py"
      - "scripts/test_database_read_model_recommendation.py"
      - "scripts/test_recommendation_information_gaps.py"
      - "scripts/test_recommendation_evidence_acquisition.py"
      - "scripts/instrument_router.py"
      - "scripts/pgbot_adapter.py"
      - "scripts/pgbot_autonomous_provider.py"
      - "scripts/resource_topology.py"
      - "examples/adapters/pgbot/postgresql.yaml"
      - "examples/topology/shop.yaml"
      - "examples/recommendations/database-read-model/**"
      - "knowledge/database/denormalized-read-model.yaml"
      - "RFC/0064-causally-justified-architecture-advice.md"
      - "RFC/0065-evidence-gated-database-read-model-recommendation.md"
      - "RFC/0067-recommendation-information-gap-ranking.md"
      - "RFC/0070-recommendation-evidence-acquisition-bridge.md"
      - ".github/workflows/database-read-model-recommendation.yml"
  pull_request:
    paths:
      - "schema/database-read-model-recommendation-context.schema.json"
      - "schema/architectural-recommendation-projection.schema.json"
      - "schema/recommendation-information-gap-projection.schema.json"
      - "schema/recommendation-evidence-acquisition-result.schema.json"
      - "scripts/database_read_model_recommendation.py"
      - "scripts/recommendation_information_gaps.py"
      - "scripts/recommendation_evidence_acquisition.py"
      - "scripts/test_database_read_model_recommendation.py"
      - "scripts/test_recommendation_information_gaps.py"
      - "scripts/test_recommendation_evidence_acquisition.py"
      - "scripts/instrument_router.py"
      - "scripts/pgbot_adapter.py"
      - "scripts/pgbot_autonomous_provider.py"
      - "scripts/resource_topology.py"
      - "examples/adapters/pgbot/postgresql.yaml"
      - "examples/topology/shop.yaml"
      - "examples/recommendations/database-read-model/**"
      - "knowledge/database/denormalized-read-model.yaml"
      - "RFC/0064-causally-justified-architecture-advice.md"
      - "RFC/0065-evidence-gated-database-read-model-recommendation.md"
      - "RFC/0067-recommendation-information-gap-ranking.md"
      - "RFC/0070-recommendation-evidence-acquisition-bridge.md"
      - ".github/workflows/database-read-model-recommendation.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Verify recommendation evidence progression
        run: python scripts/test_database_read_model_recommendation.py

      - name: Verify recommendation information-gap progression
        run: python scripts/test_recommendation_information_gaps.py

      - name: Verify recommendation evidence acquisition bridge
        run: python scripts/test_recommendation_evidence_acquisition.py

      - name: Project insufficient-context case
        run: |
          python scripts/database_read_model_recommendation.py \
            --context examples/recommendations/database-read-model/insufficient-context.json \
            --topology examples/topology/shop.yaml \
            --adapter examples/adapters/pgbot/postgresql.yaml \
            --pgbot-context examples/recommendations/database-read-model/pgbot-orders-findings.json \
            --output /tmp/read-model-insufficient.json \
            --pretty

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/read-model-insufficient.json').read_text())
          assert result['state'] == 'INSUFFICIENT_CONTEXT'
          assert result['human_approval_required'] is True
          assert result['causal_basis']['source_uri'] == 'provider-instance:provider.pgbot.orders-prod'
          PY

          cat /tmp/read-model-insufficient.json

      - name: Project next recommendation information gap
        run: |
          python scripts/recommendation_information_gaps.py \
            --recommendation-projection /tmp/read-model-insufficient.json \
            --output /tmp/read-model-information-gaps.json \
            --pretty

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/read-model-information-gaps.json').read_text())
          assert result['status'] == 'INFORMATION_GAP'
          assert result['next_action']['kind'] == 'operator_question'
          assert result['next_action']['gap_id'] == 'information_gap.business_semantics.consistency_contract'
          assert result['gaps'][0]['rank'] == 1
          PY

          cat /tmp/read-model-information-gaps.json

      - name: Project measured-benefit case
        run: |
          python scripts/database_read_model_recommendation.py \
            --context examples/recommendations/database-read-model/measured-context.json \
            --topology examples/topology/shop.yaml \
            --adapter examples/adapters/pgbot/postgresql.yaml \
            --pgbot-context examples/recommendations/database-read-model/pgbot-orders-findings.json \
            --output /tmp/read-model-measured.json \
            --pretty

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/read-model-measured.json').read_text())
          assert result['state'] == 'READY_FOR_HUMAN_REVIEW'
          assert result['benefit']['basis'] == 'measured'
          assert result['benefit']['improvement_percent'] == 88.95
          assert result['consistency']['staleness_budget_ms'] == 5000
          assert result['consistency']['update_strategy'] == 'transactional_outbox'
          assert result['missing_assumptions'] == []
          PY

          cat /tmp/read-model-measured.json

      - name: Close stale recommendation evidence gap through routed provider
        run: |
          python scripts/database_read_model_recommendation.py \
            --context examples/recommendations/database-read-model/stale-evidence-context.json \
            --topology examples/topology/shop.yaml \
            --adapter examples/adapters/pgbot/postgresql.yaml \
            --pgbot-context examples/recommendations/database-read-model/pgbot-orders-findings.json \
            --output /tmp/read-model-stale.json \
            --pretty

          python - <<'PY'
          import json
          from pathlib import Path

          current = json.loads(Path('/tmp/read-model-stale.json').read_text())
          assert current['state'] == 'NO_PROBLEM_EVIDENCE'
          assert current['evidence_scope']['boundaries'] == ['boundary.application.database']
          PY

          python scripts/recommendation_evidence_acquisition.py \
            --context examples/recommendations/database-read-model/stale-evidence-context.json \
            --current-projection /tmp/read-model-stale.json \
            --topology examples/topology/shop.yaml \
            --pgbot-adapter examples/adapters/pgbot/postgresql.yaml \
            --pgbot-context examples/recommendations/database-read-model/pgbot-orders-findings-fresh.json \
            --as-of 2026-09-15T00:10:00Z \
            --output /tmp/recommendation-acquisition.json \
            --evidence-output /tmp/recommendation-acquired-evidence.json \
            --recommendation-output /tmp/recommendation-refreshed.json \
            --gaps-output /tmp/recommendation-refreshed-gaps.json \
            --updated-context-output /tmp/recommendation-refreshed-context.json \
            --pretty

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/recommendation-acquisition.json').read_text())
          projection = json.loads(Path('/tmp/recommendation-refreshed.json').read_text())
          gaps = json.loads(Path('/tmp/recommendation-refreshed-gaps.json').read_text())
          evidence = json.loads(Path('/tmp/recommendation-acquired-evidence.json').read_text())

          assert result['previous_state'] == 'NO_PROBLEM_EVIDENCE'
          assert result['recommendation_state'] == 'INSUFFICIENT_CONTEXT'
          assert result['information_gap_status'] == 'INFORMATION_GAP'
          assert result['progressed'] is True
          assert result['routing']['instrument_id'] == 'provider.pgbot.orders-prod'
          assert result['routing']['target_resource'] == 'db.orders.prod'
          assert result['next_action']['kind'] == 'operator_question'
          assert projection['state'] == 'INSUFFICIENT_CONTEXT'
          assert gaps['next_action']['gap_id'] == 'information_gap.business_semantics.consistency_contract'
          assert evidence['incident_id'] == 'INC-READ-MODEL-001'
          PY

          cat /tmp/recommendation-acquisition.json
