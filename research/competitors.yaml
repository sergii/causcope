notes:
  - >-
    Capability values are internal research judgments based on public material reviewed on the date above;
    they are not vendor-authored claims and must be re-verified before publication.
  - >-
    A product may appear in more than one strategic role. For example Coroot and Metoro compete on RCA
    while also providing useful reference architectures for evidence collection.
  - >-
    The most important comparison is not feature count. Track the reasoning substrate: raw telemetry,
    learned context, topology, explicit failure knowledge, causal graph, falsifiers, probes and confirmation.
