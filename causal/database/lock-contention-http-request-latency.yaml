id: causal.database.lock_contention.http_request_latency
kind: causal_edge
source: hypothesis.database.lock_contention
target: observation.http.request_latency
relation: contributes_to
strength: strong
conditions:
  - The blocked database operation is on the synchronous request critical path.
  - Lock wait duration is material relative to the request latency baseline or objective.
explanation: Database lock contention contributes directly to end-to-end request latency when a request-critical database operation must wait for a conflicting lock before it can continue.
limitations:
  - A blocking chain elsewhere in the database does not imply that the affected HTTP request is delayed by that chain.
  - This edge requires runtime evidence that binds the database target and affected execution closely enough to support the critical-path relationship.
