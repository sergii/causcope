services:
  db:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
    environment:
      POSTGRES_USER: causcope_admin
      POSTGRES_PASSWORD: causcope
      POSTGRES_DB: causcope
    ports:
      - "55432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/10-pgbot-live.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causcope_admin -d causcope"]
      interval: 1s
      timeout: 1s
      retries: 30

  contention:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: causcope_app
    volumes:
      - ./contention.sql:/contention.sql:ro
    command:
      - sh
      - -ec
      - |
        PGAPPNAME="causcope-lock-blocker" psql \
          -h db \
          -U causcope_app \
          -d causcope \
          -v ON_ERROR_STOP=1 \
          -f /contention.sql &
        blocker=$$!

        sleep 1

        waiter_pids=""
        for i in $$(seq 1 3); do
          PGAPPNAME="causcope-lock-waiter" psql \
            -h db \
            -U causcope_app \
            -d causcope \
            -v ON_ERROR_STOP=1 \
            -c "UPDATE contention_target SET value = value + 1 WHERE id = 1" &
          waiter_pids="$$waiter_pids $$!"
        done

        wait "$$blocker"
        for pid in $$waiter_pids; do
          wait "$$pid"
        done
    depends_on:
      db:
        condition: service_healthy
