id: causal.database.autovacuum_pressure.database_query_latency
kind: causal_edge
source: hypothesis.database.autovacuum_pressure
target: observation.database.query_latency
relation: contributes_to
strength: weak
conditions:
  - Vacuum pressure has persisted long enough to materially degrade work on the measured PostgreSQL target and relation set.
explanation: Persistent PostgreSQL vacuum pressure can contribute to query latency when dead-tuple accumulation or disabled routine autovacuum materially degrades database work.
limitations:
  - Crossing an autovacuum trigger is maintenance pressure, not evidence that query latency is currently degraded.
  - Point-in-time vacuum pressure without query-level correlation must not be promoted to a root-cause conclusion.
  - This edge is intentionally weak until stronger historical or intervention evidence establishes the performance effect.
