name: Validate live pgbot PostgreSQL bridge

on:
  push:
    branches: [main]
    paths:
      - "lab/pgbot-live/**"
      - "scripts/pgbot_adapter.py"
      - "scripts/pgbot_autonomous_provider.py"
      - "scripts/diagnostic_provider_capabilities.py"
      - "scripts/instrument_router.py"
      - "scripts/verify_pgbot_autonomous_live.py"
      - "scripts/autonomous_investigation.py"
      - "scripts/live_postgresql_trace.py"
      - "scripts/verify_pgbot_live_integration.py"
      - "scripts/opentelemetry_trace_adapter.py"
      - "scripts/runtime_evidence_composition.py"
      - "scripts/live_diagnosis.py"
      - "examples/adapters/pgbot/postgresql.yaml"
      - "examples/adapters/opentelemetry/postgresql-dependency.yaml"
      - "examples/telemetry/opentelemetry/postgresql-query-trace.json"
      - "schema/pgbot-adapter.schema.json"
      - "schema/diagnostic-provider-capabilities.schema.json"
      - "schema/instrument-routing-decision.schema.json"
      - "RFC/0036-pgbot-live-postgresql-integration.md"
      - "RFC/0037-pgbot-autonomous-probe-provider.md"
      - "RFC/0038-diagnostic-provider-capability-discovery.md"
      - "RFC/0039-instrument-router-v0.md"
      - ".github/workflows/pgbot-live.yml"
  pull_request:
    paths:
      - "lab/pgbot-live/**"
      - "scripts/pgbot_adapter.py"
      - "scripts/pgbot_autonomous_provider.py"
      - "scripts/diagnostic_provider_capabilities.py"
      - "scripts/instrument_router.py"
      - "scripts/verify_pgbot_autonomous_live.py"
      - "scripts/autonomous_investigation.py"
      - "scripts/live_postgresql_trace.py"
      - "scripts/verify_pgbot_live_integration.py"
      - "scripts/opentelemetry_trace_adapter.py"
      - "scripts/runtime_evidence_composition.py"
      - "scripts/live_diagnosis.py"
      - "examples/adapters/pgbot/postgresql.yaml"
      - "examples/adapters/opentelemetry/postgresql-dependency.yaml"
      - "examples/telemetry/opentelemetry/postgresql-query-trace.json"
      - "schema/pgbot-adapter.schema.json"
      - "schema/diagnostic-provider-capabilities.schema.json"
      - "schema/instrument-routing-decision.schema.json"
      - "RFC/0036-pgbot-live-postgresql-integration.md"
      - "RFC/0037-pgbot-autonomous-probe-provider.md"
      - "RFC/0038-diagnostic-provider-capability-discovery.md"
      - "RFC/0039-instrument-router-v0.md"
      - ".github/workflows/pgbot-live.yml"

concurrency:
  group: pgbot-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install integration dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema 'psycopg[binary]'

      - name: Build lab connection strings from the checked-in fixture
        id: lab_connection
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import quote

          sql = Path("lab/pgbot-live/init.sql").read_text(encoding="utf-8")

          def role_password(role: str) -> str:
              match = re.search(
                  rf"CREATE ROLE {re.escape(role)} LOGIN PASSWORD '([^']+)';",
                  sql,
              )
              if match is None:
                  raise SystemExit(f"password fixture missing for {role}")
              return match.group(1)

          pgbot_password = role_password("pgbot_ro")
          app_password = role_password("causcope_app")
          print(f"::add-mask::{pgbot_password}")
          print(f"::add-mask::{app_password}")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(
                  "pgbot_dsn=postgres://pgbot_ro:"
                  + quote(pgbot_password, safe="")
                  + "@127.0.0.1:55432/causcope?sslmode=disable\n"
              )
              handle.write(
                  "app_dsn=postgres://causcope_app:"
                  + quote(app_password, safe="")
                  + "@127.0.0.1:55432/causcope?sslmode=disable\n"
              )
          PY

      - name: Start PostgreSQL lock-contention lab
        run: |
          docker compose -f lab/pgbot-live/compose.yml up -d db contention

          lock_waiters=0
          for attempt in $(seq 1 30); do
            lock_waiters="$(docker compose -f lab/pgbot-live/compose.yml exec -T db \
              psql -U causcope_admin -d causcope -Atc \
              "SELECT count(*) FROM pg_stat_activity WHERE application_name = 'causcope-lock-waiter' AND wait_event_type = 'Lock';")"
            if [ "$lock_waiters" -ge 3 ]; then
              break
            fi
            sleep 1
          done

          echo "live lock waiters: $lock_waiters"
          if [ "$lock_waiters" -lt 3 ]; then
            docker compose -f lab/pgbot-live/compose.yml logs
            exit 1
          fi

      - name: Run real pgbot against live PostgreSQL
        uses: pgrundev/pgbot@e3834c11d75e81eeeb4140b5e06d396071fa166a
        with:
          dsn: ${{ steps.lab_connection.outputs.pgbot_dsn }}
          fail-on: none
          format: json
          version: v0.8.1
          upload-sarif: "false"

      - name: Assert live pgbot observed lock contention
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("pgbot-report.json").read_text(encoding="utf-8"))
          findings = {
              item.get("id")
              for item in report.get("findings", [])
              if isinstance(item, dict) and item.get("suppressed") is not True
          }
          if report.get("schema_version") != "1.2.0":
              raise SystemExit(
                  f"unexpected live pgbot schema: {report.get('schema_version')}"
              )
          if "wait_lock_contention" not in findings:
              raise SystemExit(
                  f"wait_lock_contention missing from live pgbot findings: {sorted(findings)}"
              )
          print("pgbot live finding verified: wait_lock_contention")
          PY

      - name: Discover live pgbot provider capabilities
        run: |
          python scripts/diagnostic_provider_capabilities.py \
            --pgbot-adapter examples/adapters/pgbot/postgresql.yaml \
            --pgbot-report pgbot-report.json \
            --pretty | tee pgbot-provider-capabilities.json

          python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path("pgbot-provider-capabilities.json").read_text(encoding="utf-8"))
          provider = document["providers"][0]
          if provider["id"] != "provider.pgbot.postgresql":
              raise SystemExit(f"unexpected provider: {provider['id']}")
          if provider["availability"]["state"] != "available":
              raise SystemExit(f"pgbot provider not available: {provider['availability']}")
          probe_ids = {item["probe"]["id"] for item in provider["probes"]}
          expected = {
              "probe.database.inspect_lock_waits",
              "probe.database.measure_query_latency",
          }
          if probe_ids != expected:
              raise SystemExit(f"unexpected pgbot provider probes: {sorted(probe_ids)}")
          print("pgbot provider capability discovery verified")
          PY

      - name: Route live lock probe to a safe instrument
        run: |
          python scripts/instrument_router.py \
            --probe probe.database.inspect_lock_waits \
            --execution-requirement direct \
            --scope-boundary boundary.application.database \
            --scope-attribute service=checkout-api \
            --scope-attribute dependency=postgresql \
            --pgbot-adapter examples/adapters/pgbot/postgresql.yaml \
            --pgbot-report pgbot-report.json \
            --pretty | tee pgbot-instrument-route.json

          python - <<'PY'
          import json
          from pathlib import Path

          route = json.loads(Path("pgbot-instrument-route.json").read_text(encoding="utf-8"))
          selection = route.get("selection")
          if selection is None:
              raise SystemExit(f"router selected no instrument: {route}")
          instrument = selection["instrument"]
          if instrument["id"] != "provider.pgbot.postgresql":
              raise SystemExit(f"unexpected routed instrument: {instrument}")
          if instrument["execution_mode"] != "direct":
              raise SystemExit(f"unexpected routed execution mode: {instrument}")
          print("instrument router selected live pgbot provider")
          PY

      - name: Run autonomous Causcope loop through the instrument router
        run: |
          python scripts/verify_pgbot_autonomous_live.py \
            --pgbot-report pgbot-report.json \
            --pretty | tee pgbot-autonomous-summary.json

      - name: Release lock-contention workload
        run: |
          docker compose -f lab/pgbot-live/compose.yml exec -T db \
            psql -U causcope_admin -d causcope -v ON_ERROR_STOP=1 -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE usename = 'causcope_app' AND pid <> pg_backend_pid();"

          docker compose -f lab/pgbot-live/compose.yml stop -t 1 contention

          count=4
          for attempt in $(seq 1 10); do
            count="$(docker compose -f lab/pgbot-live/compose.yml exec -T db \
              psql -U causcope_admin -d causcope -Atc \
              "SELECT count(*) FROM pg_stat_activity WHERE usename = 'causcope_app';")"
            if [ "$count" -eq 0 ]; then
              break
            fi
            sleep 1
          done

          echo "remaining application connections: $count"
          test "$count" -eq 0

      - name: Generate trace from a real PostgreSQL query
        env:
          APP_DSN: ${{ steps.lab_connection.outputs.app_dsn }}
        run: |
          python scripts/live_postgresql_trace.py \
            --dsn "$APP_DSN" \
            --sleep-ms 180 \
            --output live-postgresql-trace.json

      - name: Compose live evidence and build diagnosis
        run: |
          python scripts/verify_pgbot_live_integration.py \
            --pgbot-report pgbot-report.json \
            --trace live-postgresql-trace.json \
            --pretty | tee pgbot-live-summary.json

      - name: Upload live evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgbot-live-evidence
          path: |
            pgbot-report.json
            pgbot-provider-capabilities.json
            pgbot-instrument-route.json
            pgbot-autonomous-summary.json
            live-postgresql-trace.json
            pgbot-live-summary.json
          if-no-files-found: warn

      - name: Stop PostgreSQL lab
        if: always()
        run: docker compose -f lab/pgbot-live/compose.yml down -v --remove-orphans
