name: Validate canonical golden product demo

on:
  push:
    branches: [main]
    paths:
      - "bin/causcope"
      - "scripts/causcope_why_entry.py"
      - "scripts/causcope_why.py"
      - "scripts/causal_verification.py"
      - "scripts/causal_verification_source.py"
      - "scripts/causal_verification_surfaces.py"
      - "scripts/runtime_incident_seed.py"
      - "scripts/rails_pool_evidence_import.py"
      - "scripts/demo_canonical_rails_pool.sh"
      - "scripts/causcope_bootstrap.py"
      - "scripts/causcope_scan.py"
      - "scripts/otlp_concrete_receiver.py"
      - "integrations/rails/**"
      - "lab/rails-connection-pool/**"
      - "RFC/0090-canonical-golden-product-demo.md"
      - ".github/workflows/golden-rails-demo.yml"
  pull_request:
    paths:
      - "bin/causcope"
      - "scripts/causcope_why_entry.py"
      - "scripts/causcope_why.py"
      - "scripts/causal_verification.py"
      - "scripts/causal_verification_source.py"
      - "scripts/causal_verification_surfaces.py"
      - "scripts/runtime_incident_seed.py"
      - "scripts/rails_pool_evidence_import.py"
      - "scripts/demo_canonical_rails_pool.sh"
      - "scripts/causcope_bootstrap.py"
      - "scripts/causcope_scan.py"
      - "scripts/otlp_concrete_receiver.py"
      - "integrations/rails/**"
      - "lab/rails-connection-pool/**"
      - "RFC/0090-canonical-golden-product-demo.md"
      - ".github/workflows/golden-rails-demo.yml"

permissions:
  contents: read

concurrency:
  group: canonical-golden-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: causcope
          POSTGRES_PASSWORD: causcope
          POSTGRES_DB: causcope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U causcope -d causcope"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema opentelemetry-proto

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/lab/rails-connection-pool/Gemfile

      - name: Run canonical product demo
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/lab/rails-connection-pool/Gemfile
          CAUSCOPE_WORKSPACE: ${{ runner.temp }}/causcope-canonical-golden
        run: bash scripts/demo_canonical_rails_pool.sh

      - name: Assert canonical verification authority
        env:
          CAUSCOPE_WORKSPACE: ${{ runner.temp }}/causcope-canonical-golden
        run: |
          ./bin/causcope why "checkout is slow" \
            --workspace "$CAUSCOPE_WORKSPACE" \
            --require-confirmed \
            --json > "$RUNNER_TEMP/canonical-why.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads((Path(os.environ["RUNNER_TEMP"]) / "canonical-why.json").read_text())
          assert document["kind"] == "causcope_why"
          assert document["status"] == "diagnosis_available"
          assert document["diagnosis"]["evidence_revision"] == 2
          claims = document["causal_verification"]["claims"]
          assert len(claims) == 1
          claim = claims[0]
          assert claim["status"] == "verified"
          assert claim["hypothesis"] == "hypothesis.database.connection_pool_exhaustion"
          assert claim["intervention"]["kind"] == "resource_capacity_release"
          assert claim["intervention"]["resource"] == "pool:active_record.primary"
          PY
