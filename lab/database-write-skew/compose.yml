services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: causcope
      POSTGRES_PASSWORD: causcope
      POSTGRES_DB: causcope
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causcope -d causcope"]
      interval: 1s
      timeout: 1s
      retries: 30

  harness:
    build: .
    image: causcope-postgres-write-skew-lab
    command: ["sleep", "infinity"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: causcope
      DB_PASSWORD: causcope
      DB_NAME: causcope
    depends_on:
      db:
        condition: service_healthy

  probe:
    image: causcope-postgres-write-skew-lab
    command: ["python", "/lab/probe.py"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: causcope
      DB_PASSWORD: causcope
      DB_NAME: causcope
    depends_on:
      db:
        condition: service_healthy
