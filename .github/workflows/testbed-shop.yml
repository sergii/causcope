name: Validate shop testbed

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "testbed/shop/**"
      - "schema/testbed-scenario*.json"
      - "schema/acceptance-benchmark-result.schema.json"
      - "scripts/validate_testbed.py"
      - "scripts/structured_log_evidence.py"
      - "scripts/test_structured_log_evidence.py"
      - "scripts/autonomous_investigation.py"
      - "scripts/test_autonomous_investigation.py"
      - "scripts/run_acceptance_benchmark.py"
      - "scripts/test_acceptance_benchmark.py"
      - "knowledge/client/**"
      - "knowledge/database/**"
      - "knowledge/observations/http-*.yaml"
      - "knowledge/observations/database-lock-error-event.yaml"
      - "knowledge/probes/compare-client-cohorts.yaml"
      - "knowledge/probes/inspect-database-lock-errors.yaml"
      - "causal/client/**"
      - "causal/database/**"
      - "vocabulary/capabilities.yaml"
      - "vocabulary/tools.yaml"
      - ".github/workflows/testbed-shop.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate scenario contracts
        run: python scripts/validate_testbed.py

      - name: Validate structured-log evidence adapter
        run: python scripts/test_structured_log_evidence.py

      - name: Validate autonomous read-only loop
        run: python scripts/test_autonomous_investigation.py

      - name: Validate acceptance benchmark scoring
        run: python scripts/test_acceptance_benchmark.py

      - name: Build and start happy path
        run: python testbed/shop/testbed.py up

      - name: Verify happy path
        run: python testbed/shop/testbed.py smoke

      - name: Run canonical deterministic acceptance benchmark
        run: |
          python scripts/run_acceptance_benchmark.py \
            --scenario sqlite-write-lock \
            --workspace /tmp/causcope-sqlite \
            --result /tmp/causcope-acceptance.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('.')
          result = json.loads(Path('/tmp/causcope-acceptance.json').read_text())
          schema = json.loads((root / 'schema/acceptance-benchmark-result.schema.json').read_text())
          errors = list(Draft202012Validator(schema).iter_errors(result))
          assert not errors, '; '.join(error.message for error in errors)
          assert result['passed'] is True
          assert result['llm']['enabled'] is False
          assert result['oracle_policy']['loaded_after_investigation'] is True
          assert result['oracle_policy']['used_to_construct_diagnosis'] is False

          evidence = json.loads(Path('/tmp/causcope-sqlite/runtime-evidence.json').read_text())
          observed = [item for item in evidence['instances'] if item['state'] == 'observed']
          assert any(item['observation'] == 'observation.http.request_failure' for item in observed)
          lock = next(item for item in observed if item['observation'] == 'observation.database.lock_error_event')
          assert lock['source']['type'] == 'probe'
          assert lock['source']['name'] == 'probe.database.inspect_lock_error_events'
          assert lock['labels']['scope_correlation'] == 'request_metadata'
          PY

      - name: Reset reference system between incidents
        run: |
          python testbed/shop/testbed.py down
          python testbed/shop/testbed.py up

      - name: Verify mobile incident through autonomous Causcope loop
        run: |
          python testbed/shop/testbed.py scenario start mobile-bad-payload
          python testbed/shop/testbed.py scenario verify mobile-bad-payload
          sleep 3
          python testbed/shop/testbed.py causcope --autonomous --max-steps 4 --incident-id incident.ci.mobile-payload --workspace /tmp/causcope-mobile --json > /tmp/mobile-summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path('/tmp/causcope-mobile/runtime-evidence.json').read_text())
          ios_scope = {
              'method': 'POST',
              'path': '/orders',
              'client_platform': 'iOS',
              'app_version': '7.42.0',
          }
          scoped = [
              item for item in evidence['instances']
              if item.get('scope', {}).get('attributes') == ios_scope
          ]
          skew = next(item for item in scoped if item['observation'] == 'observation.http.client_cohort_failure_skew')
          assert skew['state'] == 'observed'
          assert skew['labels']['failing_cohort'] == 'iOS@7.42.0'
          assert skew['source']['type'] == 'probe'
          lock = next(item for item in scoped if item['observation'] == 'observation.database.lock_error_event')
          assert lock['state'] == 'absent'
          assert lock['source']['type'] == 'probe'

          run = json.loads(Path('/tmp/causcope-mobile/autonomous-run.json').read_text())
          completed = {step['probe_id'] for step in run['steps'] if step['status'] == 'completed'}
          assert 'probe.http.compare_client_cohorts' in completed
          assert 'probe.database.inspect_lock_error_events' in completed

          summary = json.loads(Path('/tmp/mobile-summary.json').read_text())
          failing = next(
              item for item in summary['diagnoses']
              if item['target'] == 'observation.http.request_failure'
              and item['scope']['attributes'] == ios_scope
          )
          assert failing['top_hypothesis'] == 'hypothesis.client.payload_contract_mismatch'
          assert summary['autonomous']['final_evidence_revision'] >= 3
          PY
          python testbed/shop/testbed.py scenario stop mobile-bad-payload

      - name: Show logs on failure
        if: failure()
        run: docker compose -f testbed/shop/compose.yaml --profile scenarios logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f testbed/shop/compose.yaml --profile scenarios down -v --remove-orphans
